name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # Light set for now. Add torch (CPU wheel) when the tests need it.
        run: pip install pytest numpy pandas scikit-learn xgboost certifi
      - name: Tests
        run: make test
      - name: Fast end-to-end check
        run: make reproduce-fast
